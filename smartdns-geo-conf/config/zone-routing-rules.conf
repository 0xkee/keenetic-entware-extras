# Zone routing rules — maps ccTLDs and extra domains to DNS groups.
# Used by generate-conf.sh to produce nameserver directives.
#
# Format:
#   <cc>  <tld1> [<tld2> ...]        — TLD routing (mandatory, one line per country)
#   <cc>+ <domain1> [<domain2> ...]   — Extra domains (optional, CDN geo-optimization)
#
# The "+" suffix marks extra domain lines (not ccTLDs).
# All ISO 3166-1 alpha-2 codes have an implicit rule: <cc> → .<cc>
# Only countries with IDN TLDs or extra domains need explicit entries here.

# ===================================================================
# Countries with IDN TLDs (Internationalized Domain Names)
# ===================================================================

# Cyrillic script

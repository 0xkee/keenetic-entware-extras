https://youtube.com|http|intl-streaming|YouTube|<title>YouTube</title>
https://twitch.tv|http|intl-streaming|Twitch|
https://netflix.com|http|intl-streaming|Netflix|
https://spotify.com|http|intl-streaming|Spotify|

# Zone: KG (🇰🇬 Kyrgyzstan)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.
# No public DoT/DoH in Kyrgyzstan; Yandex is the closest encrypted resolver.

# --- Upstream DNS servers for kg group ---

# Yandex DoT
server-tls 77.88.8.8:853 -group kg -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

server-tls 77.88.8.1:853 -group kg -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

# UDP fallback (Yandex)
server 77.88.8.8 -group kg -exclude-default-group
server 77.88.8.1 -group kg -exclude-default-group

# --- Nameserver routing rules (KG) ---
nameserver /.kg/kg
# Kyrgyz services on .com (CDN geo-optimization)
# (most KG services use .kg TLD directly, add .com domains here if needed)

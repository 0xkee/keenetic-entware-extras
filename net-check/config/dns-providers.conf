# DNS provider identification patterns.
# Two sections: IP prefixes (glob) and ASN numbers.
# Used by identify_dns_provider() for IP matching
# and _is_known_dns_provider() for ASN-based leak detection.
# Lines starting with # are ignored.

# ── IP prefix patterns (glob) ──
# Format: ip_glob|provider_name
# Matches well-known anycast DNS server IPs.
8.8.8.*|Google DNS
8.8.4.*|Google DNS
1.1.1.*|Cloudflare
1.0.0.*|Cloudflare
9.9.9.*|Quad9
149.112.*|Quad9
208.67.222.*|OpenDNS/Cisco
208.67.220.*|OpenDNS/Cisco
146.112.*|OpenDNS/Cisco
77.88.8.*|Yandex DNS
77.88.46.*|Yandex DNS
94.140.14.*|AdGuard DNS
94.140.15.*|AdGuard DNS
185.228.168.*|CleanBrowsing
185.228.169.*|CleanBrowsing
76.76.2.*|ControlD
76.76.10.*|ControlD
194.242.2.*|Mullvad DNS

# ── ASN patterns (dns-leak detection) ──
# Format: AS<number>|provider_name
# PoP IPs of DoH/DoT providers use different ASNs than their anycast IPs
# (e.g., Cloudflare 1.1.1.1 vs PoP 172.68.x.x). These ASNs let dns-leak
# distinguish expected resolvers from ISP DNS leaks.
AS13335|Cloudflare
AS209242|Cloudflare
AS15169|Google
AS396982|Google Cloud
AS36692|OpenDNS/Cisco Umbrella
AS19281|Quad9
AS13238|Yandex
AS212772|AdGuard
AS398324|ControlD
AS14618|Amazon AWS (Route53)
AS16509|Amazon AWS
AS8075|Microsoft Azure DNS
AS20473|Choopa/Vultr (Comss, NextDNS)
AS54113|Fastly (NextDNS)

#!/opt/bin/sh
# Configuration for smartdns-geo-conf.
# Split-DNS with RU zone routing on Keenetic/Entware.
# shellcheck disable=SC2034  # all variables are used by sourcing scripts
# NOTE: _CONFIG_DIR must be set by the sourcing script before sourcing this file

# SmartDNS daemon init script (stock Entware S38)
S38="/opt/etc/init.d/S38smartdns"

# Active config read by SmartDNS daemon
CONF="/opt/etc/smartdns/smartdns.conf"

# Split-DNS config (RU zone → Yandex/AdGuard, international → Google/CF DoH)
CONF_SPLIT="/opt/etc/smartdns/smartdns-split-dns.conf"

# Default config (simple forwarder, all → Google/CF DoH, no split)
CONF_DEFAULT="/opt/etc/smartdns/smartdns-default.conf"

# State file: exists when split-DNS is enabled.
# Persistent location (survives reboot, not tmpfs).
STATE_FILE="/opt/etc/smartdns/.split-enabled"

# Bind addresses snippet: auto-detected LAN IP bind directives.
# Generated by postinst (same pattern as webui/config/listen.conf).
BIND_ADDRS_CONF="/opt/etc/smartdns/bind-addrs.conf"

# SmartDNS PID file (managed by S38/rc.func; status uses kill -0 + pidof fallback)
PIDFILE="/opt/var/run/smartdns.pid"

# SmartDNS persistent cache
CACHE_FILE="/opt/var/cache/smartdns.cache"

# SmartDNS listen port (main, used for DNS tests)
SMARTDNS_PORT=6053

# Log tag
LOG_TAG="smartdns-geo-conf"

# ===================================================================
# DNS zone & interface settings (overridden by config.conf)
# ===================================================================

# DNS zone: single country or "eas" (all EAEU).
# Options: "ru", "by", "kz", "am", "kg", "eas" (ru+by+kz+am+kg)
DNS_ZONE="eas"

# VPN interfaces for international (other) DNS, space-separated.
# Empty = direct ISP (default route only).
OTHER_DNS_INTERFACES=""

# VPN interface for zone DNS (ru/eas groups). Empty = direct (normal).
ZONE_DNS_INTERFACE=""

# ===================================================================
# Generated config file paths (produced by generate-conf.sh)
# ===================================================================
# SmartDNS conf directory
SMARTDNS_CONF_DIR="/opt/etc/smartdns"

# Per-zone server+rules configs (one file per country):
#   dns-servers-ru-zone.conf  — always generated
#   dns-servers-by-zone.conf  — only when DNS_ZONE="eas"
#   dns-servers-kz-zone.conf  — only when DNS_ZONE="eas"
#   dns-servers-am-zone.conf  — only when DNS_ZONE="eas"
#   dns-servers-kg-zone.conf  — only when DNS_ZONE="eas"

# International DNS servers (Google, Cloudflare — default group)
CONF_SERVERS_OTHER="${SMARTDNS_CONF_DIR}/dns-servers-other.conf"

# Zone: IR (🇮🇷 Iran)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.

# --- Upstream DNS servers for ir group ---

# Cloudflare DoT (global anycast, geo-optimized responses)
server-tls 1.1.1.1:853 -group ir -exclude-default-group \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com

server-tls 1.0.0.1:853 -group ir -exclude-default-group \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com

# Google DoT (global anycast)
server-tls 8.8.8.8:853 -group ir -exclude-default-group \
    -host-name dns.google \
    -tls-host-verify dns.google

server-tls 8.8.4.4:853 -group ir -exclude-default-group \
    -host-name dns.google \
    -tls-host-verify dns.google

# UDP fallback
server 1.1.1.1 -group ir -exclude-default-group
server 8.8.8.8 -group ir -exclude-default-group

# --- Nameserver routing rules (IR) ---
nameserver /.ir/ir
nameserver /.xn--mgba3a4f16a/ir

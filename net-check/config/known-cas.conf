# Known national / regional Certificate Authorities.
# One pattern per line (case-insensitive substring match against issuer string).
# If a certificate issuer matches any of these AND ssl_verify fails,
# the check reports "Untrusted CA" instead of "MITM detected".
#
# These CAs are legitimate but not in the default ca-certificates bundle.
# Sites using them will fail TLS verification without manual trust store setup.
#
# ── Russia / Россия ──
# НУЦ Минцифры (Russian Trusted Root CA) — used by Sberbank, Gosuslugi, etc.
Russian Trusted Root CA
Russian Trusted Sub CA
Mintsifry Rossii
# Cyrillic issuer variants
Минцифры России
НУЦ Минцифры
#
# ── Kazakhstan / Казахстан ──
# QAZNET Trust Network — used for govt sites, ISP-mandated interception CA
QAZNET
#
# ── Belarus / Беларусь ──
National Certification Centre of the Republic of Belarus
#
# ── China / 中国 ──
# CFCA (China Financial CA), CNNIC, SHECA — used by govt and banking
CFCA
CNNIC
SHECA
WoSign
China Internet Network
#
# ── Turkey / Türkiye ──
# TÜBİTAK / e-Tugra — national electronic ID and govt services
TUBITAK
e-Tugra
#
# ── India / भारत ──
# NIC CA, CCA India — govt services, IRCTC, etc.
National Informatics Centre
CCA India
India CCA
#
# ── Iran / ایران ──
# Government Root Certification Authority
Iran Root CA
#
# ── South Korea / 한국 ──
# GPKI (Government PKI), KISA
GPKI
KISA RootCA
#
# ── Thailand / ไทย ──
Thailand National Root CA
#
# ── Brazil / Brasil ──
# ICP-Brasil — national PKI for govt/banking
ICP-Brasil
AC Raiz

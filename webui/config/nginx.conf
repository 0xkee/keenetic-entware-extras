# nginx-webui: reverse proxy + custom dashboard for keenetic-entware-extras.
# Proxies stock Keenetic UI with inject.js for menu integration.
#
# Deploy: /opt/etc/nginx/nginx-webui.conf
# Start:  /opt/etc/init.d/S80nginx-webui start

load_module /opt/lib/nginx/modules/ngx_http_lua_module.so;

# Spike: root needed for status scripts (iptables, pidof).
# TODO(production): privilege separation via sudoers or unix socket helper.
user root;
worker_processes 1;

error_log /opt/var/log/nginx-webui-error.log warn;
pid       /opt/var/run/nginx-webui.pid;

events {
    worker_connections 64;
}

http {
    include       /opt/etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /opt/var/log/nginx-webui-access.log;

    sendfile on;
    keepalive_timeout 30;

    lua_package_path "/opt/keenetic-entware-extras/webui/lua/?.lua;/opt/lib/lua/?.lua;/opt/lib/lua/?/init.lua;;";

    # Upstream: stock Keenetic WebUI
    upstream keenetic_ui {
        server 127.0.0.1:80;
        keepalive 4;
    }

    server {
        listen 10.0.0.1:8080;
        listen 127.0.0.1:8080;

        server_name _;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # ── Custom dashboard (priority over proxy) ────────────────────────
        location /custom/ {
            alias /opt/keenetic-entware-extras/webui/static/;
            index index.html;
            try_files $uri $uri/ /custom/index.html;

            # Prevent browser caching of our JS/CSS during spike iteration
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ── API: Lua router ───────────────────────────────────────────────
        location /api/ {
            default_type application/json;
            content_by_lua_file /opt/keenetic-entware-extras/webui/lua/api-router.lua;
        }

        # ── Stock Keenetic UI + inject.js ─────────────────────────────────
        location / {
            proxy_pass http://keenetic_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Auth passthrough (HTTP Digest)
            proxy_pass_header WWW-Authenticate;
            proxy_pass_header Authorization;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie $http_cookie;

            # Disable compression so sub_filter can work
            proxy_set_header Accept-Encoding "";

            # Inject our script before </body>
            sub_filter '</body>' '<script src="/custom/inject.js"></script></body>';
            sub_filter_once on;
        }
    }
}

# Zone: AM (🇦🇲 Armenia)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.
# No public DoT/DoH in Armenia; Yandex is the closest encrypted resolver.

# --- Upstream DNS servers for am group ---

# Yandex DoT
server-tls 77.88.8.8:853 -group am -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

server-tls 77.88.8.1:853 -group am -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

# UDP fallback (Yandex)
server 77.88.8.8 -group am -exclude-default-group
server 77.88.8.1 -group am -exclude-default-group

# --- Nameserver routing rules (AM) ---
nameserver /.am/am
# Armenian services on .com (CDN geo-optimization)
# (most AM services use .am TLD directly, add .com domains here if needed)

# Firmware version → patch set mapping
# Format: DEFAULT:<version> <patch_set>
#
# Lookup order (in patch-stock-ui.sh):
#   1. DEFAULT:<major.minor.patch>  (exact, e.g. DEFAULT:5.0.11)
#   2. DEFAULT:<major.minor>        (fallback, e.g. DEFAULT:5.0)
#   3. No match → serve stock UI + inject.js only (WARN)
#
# Firmware version detected from: ndmc -c "show version" → title field.
# To add a new major version: grep v1/v2 patterns against new bundle,
# create vN.sh if needed, add DEFAULT entry below.

# --- Patch sets by firmware branch ---
DEFAULT:5.0 v1
DEFAULT:5.1.0 v3
DEFAULT:5.1 v2

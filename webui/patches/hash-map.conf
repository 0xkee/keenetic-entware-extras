# JS bundle hash → patch set mapping
# Format: JS_HASH PATCH_VERSION
# Used by patch-stock-ui.sh to select the correct patch set.
# If hash is not listed, fallback to the latest (last) patch version.
#
# To add a new firmware: grep patterns from v1.sh against the new bundle.
# If all match — just add the hash here pointing to v1.
# If patterns changed — create v2.sh and map the new hash to v2.

# KeeneticOS 5.0.4, mipsel (KN-2310 Hero 4G / KN-1011 Giga)
ZYVOXYLQ v1

# KeeneticOS 5.0.8, aarch64 (NC-4110 Hero 5G)
XXXXXXXX v1

# KeeneticOS 5.0.8, mipsel (KN-1011 Giga)
4QPHZXFY v1

# KeeneticOS 5.0.10, mipsel (KN-2310 Hero 4G)
TXLLNFBH v1

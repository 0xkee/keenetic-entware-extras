#!/opt/bin/sh
# User configuration for smartdns-geo-conf.
# Override defaults.conf values here.
# Only specify parameters that differ from defaults.
# shellcheck disable=SC2034

# ===================================================================
# DNS Zone — which domains route through local (non-international) DNS
# ===================================================================
# Set to ANY ISO 3166-1 alpha-2 country code OR a union name (unions.conf).
# All 234 country codes have zone presets in config/zones/<cc>.conf.
#
# Single country (any ISO 3166-1 code works):
#   "ru"  — Russia (.ru, .рф, .su)
#   "de"  — Germany (.de)
#   "cn"  — China (.cn, .中国)
#   "us"  — United States (.us)
#   ... (234 countries supported)
#
# Unions (see lib/geo.sh for full list of 40+):
#   "eas"     — ЕАЭС: ru by kz am kg
#   "cis"     — СНГ:  ru by kz am kg uz tj md az
#   "brics"   — BRICS+: ru br in cn za eg et ae sa ir
#   "sco"     — ШОС:  ru cn in kz kg pk tj uz ir by
#   "postsov" — Постсоветское: ru by kz am kg uz tj tm md az ua ge ee lv lt
#   "eu"      — EU-27: de fr it es nl be at pt gr fi ie lu se pl cz dk hr...
#   "nato"    — NATO-32: us ca gb fr de it es nl be pt gr pl cz dk no hr...
#   "asean"   — ASEAN: id my ph sg th vn bn kh la mm
#   "gcc"     — GCC: sa ae qa kw bh om
DNS_ZONE="eas"

# ===================================================================
# VPN interfaces for OTHER (international) DNS — default group, bypass MITM
# ===================================================================
# Space-separated list of VPN interface names.
# SmartDNS sends queries to ALL interfaces in parallel, takes first reply.
# Direct (no VPN) servers are always kept as fallback.
# Empty = direct ISP only (default route).
# Example: "nwg3 nwg4"
OTHER_DNS_INTERFACES=""

# ===================================================================
# VPN interface for ZONE DNS (Yandex, AdGuard, etc.)
# ===================================================================
# Usually empty — MITM does not interfere with Russian/EAEU DNS servers.
# Set to interface name only if zone DNS is also being blocked.
# Example: "nwg5"
ZONE_DNS_INTERFACE=""

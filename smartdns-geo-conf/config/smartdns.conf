############################################
# SmartDNS — DNS-сервер с разделением по группам
#
# Проект: smartdns-geo-conf (keenetic-entware-extras)
# Документация: https://pymumu.github.io/smartdns/
# GitHub:       https://github.com/pymumu/smartdns
############################################

# ===========================================================================
# General
# ===========================================================================

# Loopback: always available for local scripts (dig @127.0.0.1 -p 6053).
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind 127.0.0.1:6153 -no-speed-check
bind-tcp 127.0.0.1:6153 -no-speed-check

# LAN IP: auto-detected by postinst, included from external snippet.
# Allows LAN clients / ndnproxy to reach SmartDNS via router IP.
conf-file /opt/etc/smartdns/bind-addrs.conf

# Return all A-records (up to 16), not just the fastest one.
# Needed for geo-split: update-domains.sh must capture ALL IPs for multi-A domains.
max-reply-ip-num 16

# IPv4 only (no IPv6 from ISP)
force-AAAA-SOA yes

# Auto-restart SmartDNS daemon on crash
# DISABLED: execv fails with relative argv[0] when started via S38/rc.func
# restart-on-crash yes

# ===========================================================================
# Logging
# ===========================================================================

log-level error
# log-level debug
log-file /tmp/smartdns.log
log-size 128K
log-num 2

# ===========================================================================
# Cache
# ===========================================================================

cache-size 20000
cache-persist yes
cache-file /opt/var/cache/smartdns.cache
serve-expired yes
serve-expired-ttl 86400
prefetch-domain yes
# Prefetch за 6ч до expiry (было 86400/24ч — слишком агрессивно)
serve-expired-prefetch-time 21600

# TTL bounds: protect against too-low CDN TTLs and too-high stale records
rr-ttl-min 60
rr-ttl-max 86400

# ===========================================================================
# DNS servers & zones — generated by generate-conf.sh from config.conf
# ===========================================================================

# Zone DNS servers + nameserver routing rules (per-country presets)
# Generated meta-include: lists active zone conf-files based on DNS_ZONE setting.
conf-file /opt/etc/smartdns/dns-zones-active.conf

# International DNS servers (default group — Google, Cloudflare DoH)
# Generated: handles OTHER_DNS_INTERFACES for tunnel interface binding.
conf-file /opt/etc/smartdns/dns-servers-other.conf

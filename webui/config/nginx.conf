# nginx-webui: config-driven static dashboard for keenetic-entware-extras.
# Serves patched stock UI from tmpfs (/tmp/ew-webui/) + custom dashboard.
# Stock UI on :80 remains untouched; patches applied by patch-stock-ui.sh.
#
# Deploy: /opt/keenetic-entware-extras/webui/config/nginx.conf
# Start:  /opt/etc/init.d/S80nginx-webui start

load_module /opt/lib/nginx/modules/ngx_http_lua_module.so;

# Security: root required for status scripts (iptables, pidof, ip rule).
# Options for privilege separation (when moving to production):
#   1. sudoers: run nginx as nobody, sudo /opt/.../status.sh (needs opkg install sudo)
#   2. Unix socket helper: root daemon runs status checks, nginx queries via socket
#   3. Linux capabilities: cap_net_admin on worker (not supported on all Entware builds)
# Current risk: acceptable — listen.conf binds to LAN IP only (not WAN-facing).
# TODO(production): implement option 1 or 2 before exposing to untrusted networks.
user root;
# auto = number of CPU cores. On 4-core MIPS routers: 4 workers.
# io.popen in Lua blocks one worker per status.sh call; with per-endpoint
# TTL (5-15s cache) only 1-2 concurrent popen at steady state.
worker_processes auto;

error_log /opt/tmp/nginx-webui-error.log error;
pid       /opt/tmp/nginx-webui.pid;

events {
    worker_connections 64;
}

http {
    include       /opt/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log disabled: all diagnostics via error_log + status.sh --json.
    # Eliminates ~1.5MB/day disk writes from API polling.
    access_log off;

    sendfile on;
    keepalive_timeout 30;

    # ── Gzip compression for static + proxied responses ──────────────
    # Compresses JS bundle from tmpfs (~6MB → ~2MB) and API JSON.
    # Level 1: minimal CPU on MIPS routers, still ~67% compression.
    # Note: gzip does NOT affect WebSocket frames (/rci/ Upgrade),
    # but may add latency to /rci/ HTTP polling for real-time graphs.
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json text/xml;
    gzip_comp_level 1;
    gzip_min_length 1024;

    # ── Rate limiting for API action routes (POST only) ────────────────
    # 1 request/sec burst 3 — prevents accidental spam of start/stop/update.
    # Empty key for non-POST = not rate-limited (nginx ignores empty keys).
    map $request_method $api_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $api_limit_key zone=api_post:1m rate=1r/s;

    lua_package_path "/opt/keenetic-entware-extras/webui/lua/?.lua;/opt/lib/lua/?.lua;/opt/lib/lua/?/init.lua;;";

    # ── Status API cache ──────────────────────────────────────────────
    # Shared memory zone for caching status.sh JSON responses.
    # Deduplicates concurrent poll requests from multiple browser tabs:
    # only one worker runs the script per TTL window, others get cached result.
    # 1MB ≈ 100+ cached responses (each ~5-10KB JSON).
    lua_shared_dict status_cache 1m;

    # ── Auto-detect stock CSS filenames at startup ────────────────────
    # Scans /usr/share/htdocs_/*.css filesystem (no HTML parsing).
    # Hash changes with firmware updates; detected once at nginx start.
    # Reload (`nginx -s reload`) re-detects after firmware upgrade.
    # Note: Entware nginx-mod-lua built with NGX_LUA_NO_BY_LUA_BLOCK,
    # so we use *_by_lua_file / *_by_lua string variants.
    init_by_lua_file /opt/keenetic-entware-extras/webui/lua/stock-css-init.lua;

    # ── WebSocket support for stock UI real-time graphs ───────────────
    # When client sends Upgrade: websocket, set Connection: upgrade.
    # Otherwise keep empty for normal HTTP requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        # LAN IP auto-detected by postinst → listen.conf (not a conffile).
        # Loopback always included for local API access.
        include /opt/keenetic-entware-extras/webui/config/listen.conf;
        listen 127.0.0.1:8080;

        server_name _;

        # ── Custom dashboard static files (JS, CSS, images) ──────────────
        location /custom/ {
            alias /opt/keenetic-entware-extras/webui/static/;
            index index.html;
            try_files $uri $uri/ /custom/index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ── API: Lua router ──────────────────────────────────────────────
        location /api/ {
            default_type application/json;

            # Rate limit POST actions (1r/s, burst 3). GET not affected.
            limit_req zone=api_post burst=3 nodelay;
            limit_req_status 429;

            # CORS: restrict to same-origin (LAN). Block cross-site JS.
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;

            # Auth guard: POST (start/stop/update) requires valid session.
            # Sends subrequest to /auth which proxies to stock httpd.
            # GET /api/*/status remains open (read-only monitoring).
            access_by_lua '
                if ngx.req.get_method() == "POST" then
                    local res = ngx.location.capture("/auth")
                    if not res or res.status == 401 or res.status == 403 then
                        ngx.status = 401
                        ngx.header["Content-Type"] = "application/json"
                        ngx.say([[{"ok":false,"error":"unauthorized"}]])
                        return ngx.exit(401)
                    end
                end
            ';

            content_by_lua_file /opt/keenetic-entware-extras/webui/lua/api-router.lua;
        }

        # ── Auth: proxy to stock httpd ───────────────────────────────────
        # $stock_httpd defined in listen.conf (auto-detected LAN IP, no trailing slash)
        location = /auth {
            proxy_pass $stock_httpd;
            proxy_set_header Host $host;
            proxy_pass_header WWW-Authenticate;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie $http_cookie;
        }

        # ── RCI: API + WebSocket + card position save/load ───────────────
        location /rci/ {
            proxy_pass $stock_httpd;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # /rci/ responses up to 241KB — avoid "buffered to temporary file"
            proxy_buffer_size    16k;
            proxy_buffers        8 32k;
            proxy_busy_buffers_size 64k;
        }

        # ── Patched index.html ───────────────────────────────────────────
        location = /index.html {
            root /tmp/ew-webui;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ── Stock static files (from tmpfs copy) ─────────────────────────
        location / {
            root /tmp/ew-webui;
            try_files $uri /index.html;
        }
    }
}

############################################
# SmartDNS — DNS-сервер с разделением по группам
#
# Проект: smartdns-ru (keenetic-entware-extras)
# Документация: https://pymumu.github.io/smartdns/
# GitHub:       https://github.com/pymumu/smartdns
############################################

# ===========================================================================
# General
# ===========================================================================

# Слушаем на порту 6053 (Keenetic использует свой DNS на 53)
bind 0.0.0.0:6053

# geo-split: all IPs without speed-check filtering (for update-domains.sh)
bind 0.0.0.0:6153 -no-speed-check

# Return all A-records (up to 16), not just the fastest one.
# Needed for geo-split: update-domains.sh must capture ALL IPs for multi-A domains.
max-reply-ip-num 16

# IPv4 only (no IPv6 from ISP)
force-AAAA-SOA yes

# Block HTTPS/SVCB DNS records (type 65) — not needed on router, may cause issues
force-qtype-SOA 65

# Auto-restart SmartDNS daemon on crash
# DISABLED: execv fails with relative argv[0] when started via S38/rc.func
# restart-on-crash yes

# ===========================================================================
# Logging
# ===========================================================================

log-level error
# log-level debug
log-file /opt/var/log/smartdns.log
log-size 128K
log-num 2

# ===========================================================================
# Cache
# ===========================================================================

cache-size 20000
cache-persist yes
cache-file /opt/var/cache/smartdns.cache
serve-expired yes
serve-expired-ttl 86400
prefetch-domain yes
# Prefetch за 6ч до expiry (было 86400/24ч — слишком агрессивно)
serve-expired-prefetch-time 21600

# TTL bounds: protect against too-low CDN TTLs and too-high stale records
rr-ttl-min 60
rr-ttl-max 86400

# ===========================================================================
# 🇷🇺 Russian DNS — Yandex (primary) + AdGuard non-filtering (secondary)
#
# DoT к российским серверам стабилен — ТСПУ не блокирует.
# Флаг -k (skip TLS verify) убран — ca-certificates в зависимостях пакета.
# UDP fallback для надёжности.
# ===========================================================================

# Yandex DoT (базовый, без фильтрации)
# hostname обновлён: dns.yandex.ru (deprecated) → common.dot.dns.yandex.net
server-tls 77.88.8.8:853 -group ru -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

server-tls 77.88.8.1:853 -group ru -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

# AdGuard Non-filtering DoT
# IP исправлены: 94.140.14.14/15 (default/family) → 94.140.14.140/141 (unfiltered)
# hostname исправлен: dns-unfiltered.adguard.com → unfiltered.adguard-dns.com
server-tls 94.140.14.140:853 -group ru -exclude-default-group \
    -host-name unfiltered.adguard-dns.com \
    -tls-host-verify unfiltered.adguard-dns.com

server-tls 94.140.14.141:853 -group ru -exclude-default-group \
    -host-name unfiltered.adguard-dns.com \
    -tls-host-verify unfiltered.adguard-dns.com

# UDP fallback (Yandex — достаточно для надёжности)
server 77.88.8.8 -group ru -exclude-default-group
server 77.88.8.1 -group ru -exclude-default-group

# ===========================================================================
# 🌍 International DNS — Google + Cloudflare (default group)
#
# Mode A: Direct (без VPN) — только DoH (HTTPS/443).
# Plain UDP убран — не надёжно.
# DoT (порт 853) убран — не надёжно.
# DoH через стандартный HTTPS-порт 443 — лучше.
# ===========================================================================

# Google DoH — разные IP для redundancy
server-https https://dns.google/dns-query \
    -host-name dns.google \
    -http-host dns.google \
    -host-ip 8.8.8.8 \
    -tls-host-verify dns.google

server-https https://dns.google/dns-query \
    -host-name dns.google \
    -http-host dns.google \
    -host-ip 8.8.4.4 \
    -tls-host-verify dns.google

# Cloudflare DoH — разные IP для redundancy
server-https https://cloudflare-dns.com/dns-query \
    -host-name cloudflare-dns.com \
    -http-host cloudflare-dns.com \
    -host-ip 1.1.1.1 \
    -tls-host-verify cloudflare-dns.com

server-https https://cloudflare-dns.com/dns-query \
    -host-name cloudflare-dns.com \
    -http-host cloudflare-dns.com \
    -host-ip 1.0.0.1 \
    -tls-host-verify cloudflare-dns.com

# ===========================================================================
# 🇷🇺 RU routing rules — какие домены идут через ru-группу
# ===========================================================================
# nameserver /domain/group — domain БЕЗ ведущей точки
# суффикс "ru" → .ru и все *.ru

# Russian TLDs
nameserver /.ru/ru
# .рф (punycode)
nameserver /.xn--p1ai/ru
nameserver /.su/ru

# Российские сервисы на .com/.net — резолв через российский DNS
# для получения IP ближайшего CDN-узла (geo-optimization)
nameserver /vk.com/ru
nameserver /mail.ru/ru
nameserver /yandex.com/ru
nameserver /yandex.net/ru
nameserver /sberbank.com/ru
nameserver /tinkoff.com/ru
nameserver /gosuslugi.ru/ru

# ===========================================================================
# 🌍 Mode B: VPN-protected foreign DNS
# ===========================================================================
# Раскомментируйте для маршрутизации foreign DNS через VPN.
# Закомментируйте секцию Mode A выше перед включением.
# Замените nwg0 на имя вашего VPN-интерфейса.
# Проверить: ip link show | grep -E 'nwg|ovpn|l2tp'
#
# server 8.8.8.8 -interface nwg0
# server 8.8.4.4 -interface nwg0
# server 1.1.1.1 -interface nwg0
# server 1.0.0.1 -interface nwg0
#
# Fallback без VPN (если VPN down — DNS всё равно работает)
# server 8.8.8.8 -fallback
# server 8.8.4.4 -fallback
############################################

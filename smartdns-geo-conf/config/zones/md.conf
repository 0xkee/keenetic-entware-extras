# Zone: MD (🇲🇩 Moldova)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.

# --- Upstream DNS servers for md group ---

# Yandex DoT (CIS coverage, CDN presence)
server-tls 77.88.8.8:853 -group md -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

server-tls 77.88.8.1:853 -group md -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

# AdGuard Non-filtering DoT (CIS coverage)
server-tls 94.140.14.140:853 -group md -exclude-default-group \
    -host-name unfiltered.adguard-dns.com \
    -tls-host-verify unfiltered.adguard-dns.com

# UDP fallback (Yandex)
server 77.88.8.8 -group md -exclude-default-group
server 77.88.8.1 -group md -exclude-default-group

# --- Nameserver routing rules (MD) ---
nameserver /.md/md

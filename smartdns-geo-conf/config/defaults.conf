#!/opt/bin/sh
# Configuration for smartdns-geo-conf.
# Split-DNS with RU zone routing on Keenetic/Entware.
# shellcheck disable=SC2034  # all variables are used by sourcing scripts
# NOTE: _CONFIG_DIR must be set by the sourcing script before sourcing this file

# SmartDNS daemon init script (stock Entware S38)
S38="/opt/etc/init.d/S38smartdns"

# Active config read by SmartDNS daemon
CONF="/opt/etc/smartdns/smartdns.conf"

# Split-DNS config (RU zone → Yandex/AdGuard, international → Google/CF DoH)
CONF_SPLIT="/opt/etc/smartdns/smartdns-split-dns.conf"

# Default config (simple forwarder, all → Google/CF DoH, no split)
CONF_DEFAULT="/opt/etc/smartdns/smartdns-default.conf"

# State file: exists when split-DNS is enabled.
# Persistent location (survives reboot, not tmpfs).
STATE_FILE="/opt/etc/smartdns/.split-enabled"

# Bind addresses snippet: auto-detected LAN IP bind directives.
# Generated by postinst (same pattern as webui/config/listen.conf).
BIND_ADDRS_CONF="/opt/etc/smartdns/bind-addrs.conf"

# SmartDNS PID file (managed by S38/rc.func; status uses kill -0 + pidof fallback)
PIDFILE="/opt/var/run/smartdns.pid"

# SmartDNS persistent cache
CACHE_FILE="/opt/var/cache/smartdns.cache"

# SmartDNS listen port (main, used for DNS tests)
SMARTDNS_PORT=6053

# Log tag
LOG_TAG="smartdns-geo-conf"

# ===================================================================
# DNS zone & interface settings (overridden by config.conf)
# ===================================================================

# DNS Zone — which domains route through local (non-international) DNS.
# Set to ANY ISO 3166-1 alpha-2 country code OR a union name.
#
# Single country (any ISO 3166-1 code works):
#   "ru"  — Russia (.ru, .рф, .su)
#   "de"  — Germany (.de)
#   "cn"  — China (.cn, .中国)
#   "us"  — United States (.us)
#   ... (234 countries supported)
#
# Unions (see lib/geo.sh for full list of 40+):
#   "eas"     — ЕАЭС: ru by kz am kg
#   "cis"     — СНГ:  ru by kz am kg uz tj md az
#   "brics"   — BRICS+: ru br in cn za eg et ae sa ir
#   "sco"     — ШОС:  ru cn in kz kg pk tj uz ir by
#   "postsov" — Постсоветское: ru by kz am kg uz tj tm md az ua ge ee lv lt
#   "eu"      — EU-27: de fr it es nl be at pt gr fi ie lu se pl cz dk hr...
#   "nato"    — NATO-32: us ca gb fr de it es nl be pt gr pl cz dk no hr...
#   "asean"   — ASEAN: id my ph sg th vn bn kh la mm
#   "gcc"     — GCC: sa ae qa kw bh om
DNS_ZONE="eas"

# VPN interfaces for OTHER (international) DNS — default group, bypass MITM.
# Space-separated list of VPN interface names.
# SmartDNS sends queries to ALL interfaces in parallel, takes first reply.
# Direct (no VPN) servers are always kept as fallback.
# Empty = direct ISP only (default route).
# Example: "nwg3 nwg4"
OTHER_DNS_INTERFACES=""

# VPN interface for ZONE DNS (Yandex, AdGuard, etc.).
# Usually empty — MITM does not interfere with Russian/EAEU DNS servers.
# Set to interface name only if zone DNS is also being blocked.
# Example: "nwg5"
ZONE_DNS_INTERFACE=""

# International DNS provider(s) for the default group.
# Space-separated. Available: google cloudflare quad9 quad9uf mullvad mullvad_adblock controld adguard
# See config/dns-providers.conf for full provider catalog.
OTHER_DNS_PROVIDER="google cloudflare"

# Zone DNS provider(s) for regional group (RU/CIS/etc).
# Space-separated. Available: yandex yandex_safe yandex_family adguard adguard_ads alidns tencent
# See config/dns-providers.conf for full provider catalog.
ZONE_DNS_PROVIDER="yandex adguard"

# ===================================================================
# Source data files (read by generate-conf.sh)
# ===================================================================

# DNS providers catalog (server IPs, hostnames, protocols)
DNS_PROVIDERS_CONF="${_CONFIG_DIR}/dns-providers.conf"

# Zone routing rules (ccTLD mappings + extra CDN domains)
ZONE_ROUTING_RULES="${_CONFIG_DIR}/zone-routing-rules.conf"

# ===================================================================
# Generated config file paths (produced by generate-conf.sh)
# ===================================================================
# SmartDNS conf directory
SMARTDNS_CONF_DIR="/opt/etc/smartdns"

# Generated files:
#   dns-zones-active.conf   — zone upstream servers + nameserver routing (all-in-one)
#   dns-servers-other.conf  — international DNS servers (default group)

# International DNS servers (Google, Cloudflare — default group)
CONF_SERVERS_OTHER="${SMARTDNS_CONF_DIR}/dns-servers-other.conf"

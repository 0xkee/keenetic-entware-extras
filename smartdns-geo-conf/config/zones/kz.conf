# Zone: KZ (🇰🇿 Kazakhstan)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.
# No public DoT/DoH in Kazakhstan; Yandex has CDN in KZ, AdGuard covers CIS.

# --- Upstream DNS servers for kz group ---

# Yandex DoT (CDN presence in Kazakhstan)
server-tls 77.88.8.8:853 -group kz -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

server-tls 77.88.8.1:853 -group kz -exclude-default-group \
    -host-name common.dot.dns.yandex.net \
    -tls-host-verify common.dot.dns.yandex.net

# AdGuard Non-filtering DoT (CIS coverage)
server-tls 94.140.14.140:853 -group kz -exclude-default-group \
    -host-name unfiltered.adguard-dns.com \
    -tls-host-verify unfiltered.adguard-dns.com

# UDP fallback (Yandex)
server 77.88.8.8 -group kz -exclude-default-group
server 77.88.8.1 -group kz -exclude-default-group

# --- Nameserver routing rules (KZ) ---
nameserver /.kz/kz
# Kazakh services on .com (CDN geo-optimization)
nameserver /airastana.com/kz

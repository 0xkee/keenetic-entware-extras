############################################
# SmartDNS — default mode (simple forwarder)
#
# Split-DNS disabled. All queries forwarded to Google/Cloudflare DoH.
# This config is activated when smartdns-conf-ru-split toggle is OFF.
#
# Ports, cache, and logging match the split-DNS config
# so dependents (smartdns-redirect, geo-split) keep working.
############################################

# ===========================================================================
# General
# ===========================================================================

# Loopback: always available for local scripts (dig @127.0.0.1 -p 6053).
bind 127.0.0.1:6053
bind 127.0.0.1:6153 -no-speed-check

# LAN IP: auto-detected by postinst, included from external snippet.
conf-file /opt/etc/smartdns/bind-addrs.conf

# Return all A-records (up to 16), not just the fastest one.
# Needed for geo-split: update-domains.sh must capture ALL IPs for multi-A domains.
max-reply-ip-num 16

# IPv4 only (no IPv6 from ISP)
force-AAAA-SOA yes

# Block HTTPS/SVCB DNS records (type 65)
force-qtype-SOA 65

# ===========================================================================
# Logging
# ===========================================================================

log-level error
log-file /tmp/smartdns.log
log-size 128K
log-num 2

# ===========================================================================
# Cache
# ===========================================================================

cache-size 20000
cache-persist yes
cache-file /opt/var/cache/smartdns.cache
serve-expired yes
serve-expired-ttl 86400
prefetch-domain yes
serve-expired-prefetch-time 21600

rr-ttl-min 60
rr-ttl-max 86400

# ===========================================================================
# DNS servers — all queries go to Google + Cloudflare DoH
# ===========================================================================

# Google DoH
server-https https://dns.google/dns-query \
    -host-name dns.google \
    -http-host dns.google \
    -host-ip 8.8.8.8 \
    -tls-host-verify dns.google

server-https https://dns.google/dns-query \
    -host-name dns.google \
    -http-host dns.google \
    -host-ip 8.8.4.4 \
    -tls-host-verify dns.google

# Cloudflare DoH
server-https https://cloudflare-dns.com/dns-query \
    -host-name cloudflare-dns.com \
    -http-host cloudflare-dns.com \
    -host-ip 1.1.1.1 \
    -tls-host-verify cloudflare-dns.com

server-https https://cloudflare-dns.com/dns-query \
    -host-name cloudflare-dns.com \
    -http-host cloudflare-dns.com \
    -host-ip 1.0.0.1 \
    -tls-host-verify cloudflare-dns.com

# smartdns-redirect configuration
# See: https://github.com/0xkee/keenetic-entware-extras/tree/main/smartdns-redirect

# Port to redirect DNS traffic to (local DNS on router).
# Defaults: SmartDNS=6053, AGH=5353, Unbound=5335
UPSTREAM_PORT=6053

# Interfaces to intercept (space-separated). Leave empty to disable.
# Typical: "br0" for LAN. Add "br1" for Guest VLAN.
INTERFACES="br0"

# Enable IPv6 redirect (ip6tables). Experimental.
ENABLE_IPV6=no

# Watchdog: restart upstream DNS service if unresponsive.
# Set to service name (e.g., "S38smartdns") or leave empty to disable.
WATCHDOG_SERVICE="S38smartdns"

# Preserve Keenetic filter profiles (Phase 5, NOT yet implemented).
# When enabled: MACs bound via "dns-proxy filter profile host <mac>" are
# excluded from DNAT so Keenetic parental-control filters keep working.
PRESERVE_FILTER_PROFILES=no

# PID file (written on start, removed on stop; mtime used for uptime)
PIDFILE="/tmp/smartdns-redirect.pid"

# nginx-webui log rotation.
# Deployed to: /opt/etc/logrotate.d/nginx-webui
# Requires: logrotate package + cron (cron.daily runs logrotate).

/tmp/nginx-webui-access.log
/tmp/nginx-webui-error.log {
    daily
    rotate 3
    missingok
    notifempty
    compress
    delaycompress
    postrotate
        [ -f /tmp/nginx-webui.pid ] && kill -USR1 "$(cat /tmp/nginx-webui.pid)" 2>/dev/null || true
    endscript
}

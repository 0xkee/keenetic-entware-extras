# Domains for CDN geo-steering analysis (worldwide catalog)
# Format: domain|category|description[|custom_headers]
# category: global, intl-*, zone-<cc>
#
# Runtime filtering: _cat_config() includes global + intl always;
# zone-<cc> entries only when <cc> is in the active _ZONE_CC_LIST.
# User customizations go into cdn-domains-custom.conf (conffile).
#
# --- Global CDN (edge depends on DNS resolver location) ---
cdnjs.cloudflare.com|global|Cloudflare CDN
cdn.jsdelivr.net|global|jsDelivr CDN
#
# --- International CDN (edge depends on VPN exit country) ---
www.youtube.com|intl-streaming|YouTube
dl.google.com|intl-google|Google Downloads
scontent.cdninstagram.com|intl-social|Instagram CDN
static.xx.fbcdn.net|intl-social|Facebook CDN
#

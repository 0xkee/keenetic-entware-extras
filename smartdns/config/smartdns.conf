############################################
# SmartDNS — DNS-сервер с разделением по группам
#
# Документация: https://pymumu.github.io/smartdns/
# GitHub:       https://github.com/pymumu/smartdns
############################################

# Слушаем на порту 6053 (Keenetic использует свой DNS на 53)
bind 0.0.0.0:6053

# Cache & speed
cache-size 20000
serve-expired yes
serve-expired-ttl 86400
prefetch-domain yes
serve-expired-prefetch-time 86400

# IPv6 / Dualstack
# dualstack-ip-selection yes              # включено по умолчанию
# Отключить AAAA-записи (форсировать IPv4):
force-AAAA-SOA yes

# ----------------------------------------------------------------------------------
# 🇷🇺 Russian DNS — Yandex/AdGuard, вынесены из default group
# ----------------------------------------------------------------------------------

# Yandex DoT
server-tls 77.88.8.8:853 -group ru -exclude-default-group \
    -host-name dns.yandex.ru \
    -tls-host-verify dns.yandex.ru \
    -k

server-tls 77.88.8.1:853 -group ru -exclude-default-group \
    -host-name dns.yandex.ru \
    -tls-host-verify dns.yandex.ru \
    -k

# AdGuard DoT (unfiltered)
server-tls 94.140.14.14:853 -group ru -exclude-default-group \
    -host-name dns-unfiltered.adguard.com \
    -tls-host-verify dns-unfiltered.adguard.com \
    -k

server-tls 94.140.14.15:853 -group ru -exclude-default-group \
    -host-name dns-unfiltered.adguard.com \
    -tls-host-verify dns-unfiltered.adguard.com \
    -k

# UDP fallback
server 77.88.8.8    -group ru -exclude-default-group
server 77.88.8.1    -group ru -exclude-default-group
server 94.140.14.14 -group ru -exclude-default-group
server 94.140.14.15 -group ru -exclude-default-group

# ----------------------------------------------------------------------------------
# 🌍 International DNS — Cloudflare + Google, остаются в default group
# ----------------------------------------------------------------------------------

# Cloudflare DoT — основной международный
server-tls 1.1.1.1:853 \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com \
    -k

server-tls 1.0.0.1:853 \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com \
    -k

# Cloudflare DoH fallback
server-https https://cloudflare-dns.com/dns-query \
    -host-name cloudflare-dns.com \
    -http-host cloudflare-dns.com \
    -bootstrap-dns 1.1.1.1 \
    -k

# Google (UDP fallback)
server 8.8.8.8
server 8.8.4.4

# ----------------------------------------------------------------------------------
# 🇷🇺 RU routing rules
# ----------------------------------------------------------------------------------
# nameserver /domain/group — domain БЕЗ ведущей точки
# суффикс "ru" → .ru, gov.ru → все *.gov.ru и т.п.

nameserver /.ru/ru              # .ru → группа ru
nameserver /.xn--p1ai/ru        # .рф → группа ru
nameserver /.su/ru              # .su → группа ru

# Дополнительные явные домены (перекрываются правилом /.ru/, но оставляем для наглядности)
nameserver /gov.ru/ru
nameserver /nalog.ru/ru
nameserver /mosenergosbyt.ru/ru
nameserver /gosuslugi.ru/ru

# ----------------------------------------------------------------------------------
# Логи
# ----------------------------------------------------------------------------------
log-level error
#log-level debug
# log-file /opt/var/log/smartdns.log
# log-console yes
############################################

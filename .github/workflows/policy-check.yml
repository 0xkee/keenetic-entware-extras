name: Policy Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  legal-terminology:
    name: Legal & Privacy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden legal terminology
        env:
          CRITICAL_TERMS_JSON: ${{ secrets.POLICY_CRITICAL_TERMS }}
          HIGH_TERMS_JSON: ${{ secrets.POLICY_HIGH_TERMS }}
        run: |
          # Terms are stored in GitHub Secrets (not in public code)
          # POLICY_CRITICAL_TERMS: JSON array of absolute-ban terms (literal grep)
          # POLICY_HIGH_TERMS: JSON array of discouraged terms (regex grep -E)
          if [ -z "$CRITICAL_TERMS_JSON" ] || [ -z "$HIGH_TERMS_JSON" ]; then
            echo "::warning::Policy secrets not configured — skipping legal scan"
            echo "Set POLICY_CRITICAL_TERMS and POLICY_HIGH_TERMS repository secrets"
            exit 0
          fi

          FP_EXCLUDES="check-privacy\.sh|pre-commit|legal-terminology|policy-check\.yml|docs/archive|docs/comparison|alternatives-research|zone-sizes-research"

          echo "── Checking legal terminology (CRITICAL) ──"
          errors=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue
            matches=$(grep -rnI "$term" . \
              --include='*.sh' --include='*.md' --include='*.lua' \
              --include='*.js' --include='*.css' --include='*.html' \
              --include='*.conf' --include='*.txt' \
              --exclude-dir=.git \
              | grep -vE "$FP_EXCLUDES" || true)
            if [ -n "$matches" ]; then
              echo "::error::Forbidden term found in:"
              echo "$matches"
              errors=$((errors + 1))
            fi
          done < <(echo "$CRITICAL_TERMS_JSON" | jq -r '.[]')

          echo "── Checking legal terminology (HIGH) ──"
          warnings=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue
            matches=$(grep -rnIE "$term" . \
              --include='*.sh' --include='*.md' --include='*.lua' \
              --include='*.js' --include='*.css' --include='*.html' \
              --include='*.conf' --include='*.txt' \
              --exclude-dir=.git \
              | grep -vE "$FP_EXCLUDES|ru-whitelist|rkn\.gov\.ru|docs/archive|docs/comparison" || true)
            if [ -n "$matches" ]; then
              echo "::warning::Discouraged term found in:"
              echo "$matches"
              warnings=$((warnings + 1))
            fi
          done < <(echo "$HIGH_TERMS_JSON" | jq -r '.[]')

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors CRITICAL legal term violation(s) found"
            exit 1
          fi
          echo "✓ Legal check: $errors critical, $warnings warnings"

      - name: Check for hardcoded secrets
        run: |
          echo "── Checking for hardcoded secrets ──"
          errors=0
          SECRET_PATTERNS=(
            "PRIVATE KEY"
            "BEGIN RSA"
            "BEGIN EC PRIVATE"
          )

          FP_EXCLUDES="check-privacy|pre-commit|policy-check|\.gitignore"

          for pattern in "${SECRET_PATTERNS[@]}"; do
            matches=$(grep -rnI "$pattern" . \
              --exclude-dir=.git \
              --exclude='*.ipk' --exclude='*.gz' \
              | grep -vE "$FP_EXCLUDES" || true)
            if [ -n "$matches" ]; then
              echo "::error::Secret pattern '$pattern' found"
              echo "$matches" | head -5
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors secret pattern(s) found"
            exit 1
          fi
          echo "✓ No hardcoded secrets"

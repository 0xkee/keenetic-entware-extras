# Network connectivity verification targets (worldwide catalog)
# Format: url|check_type|category|description|expected_string
# check_type: http (2xx + 403-with-valid-TLS), geo
# category: global, zone-<cc>, intl-<subcategory>
#   global       — infrastructure, reachable from any path
#   zone-<cc>    — resource of a specific country (cc = ISO 3166-1 alpha-2)
#   intl-<subcat> — international resource, outside any geo zone
# expected_string: optional — grep body for this string (content fingerprint)
#
# Runtime filtering: _cat_config() includes global + intl always;
# zone-<cc> entries only when <cc> is in the active _ZONE_CC_LIST.
# User customizations go into check-targets-custom.conf (conffile).
#
# ═══════════════════════════════════════════════════════════════════
# GLOBAL — Infrastructure probes (reachable from any path)
# ═══════════════════════════════════════════════════════════════════
https://ifconfig.me/ip|geo|global|External IP|
https://ipinfo.io/json|geo|global|IP + Country + ASN|
https://github.com|http|global|GitHub|
https://cloudflare.com|http|global|Cloudflare|
https://intel.com|http|global|Intel|

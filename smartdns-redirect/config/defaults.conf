#!/opt/bin/sh
# shellcheck disable=SC2034  # all variables are used by sourcing scripts
# smartdns-redirect configuration
# See: https://github.com/0xkee/keenetic-entware-extras/tree/main/smartdns-redirect

# Port to redirect DNS traffic to (local DNS on router).
# Defaults: SmartDNS=6053, AGH=5353, Unbound=5335
UPSTREAM_PORT=6053

# Interfaces to intercept (space-separated). Leave empty to disable.
# Typical: "br0" for LAN. Add "br1" for Guest VLAN.
INTERFACES="br0"

# Redirect mode:
# "force" (default) — intercept ALL :53 DNS from INTERFACES + block DoT :853.
#                     Clients cannot bypass SmartDNS.
# "local" — intercept only DNS to router IP → SmartDNS. External DNS (8.8.8.8)
#           passes through. DoT :853 NOT blocked. For IoT/corporate laptops.
REDIRECT_MODE="force"

# IPv6 DNS handling is fully automatic (no user option needed).
# When SmartDNS has IPv6 bind + br0 has global IPv6 → ip6tables DNAT.
# Otherwise → ip6tables INPUT REJECT → instant Happy Eyeballs fallback to IPv4.

# Watchdog: restart upstream DNS service if unresponsive.
# Set to service name (e.g., "S38smartdns") or leave empty to disable.
WATCHDOG_SERVICE="S38smartdns"

# Preserve Keenetic filter profiles (Phase 5, NOT yet implemented).
# When enabled: MACs bound via "dns-proxy filter profile host <mac>" are
# excluded from DNAT so Keenetic parental-control filters keep working.
PRESERVE_FILTER_PROFILES=no

# DoT blocking: DNS-over-TLS (port 853) from LAN clients is always blocked
# via iptables FORWARD REJECT. Prevents clients from bypassing DNS redirect
# via direct DoT to external resolvers (8.8.8.8:853, 1.1.1.1:853, etc.).
# No configuration needed — enabled automatically alongside DNAT :53.

# PID file (written on start, removed on stop)
PIDFILE="/opt/tmp/smartdns-redirect.pid"

# ─── Alternative DNS resolver presets (uncomment one block) ───
#
# --- AdGuard Home ---
# UPSTREAM_PORT=5353
# WATCHDOG_SERVICE="S99adguardhome"
#
# --- Unbound ---
# UPSTREAM_PORT=5335
# WATCHDOG_SERVICE="S61unbound"

# nginx-webui: reverse proxy + custom dashboard for keenetic-entware-extras.
# Proxies stock Keenetic UI with inject.js for menu integration.
#
# Deploy: /opt/keenetic-entware-extras/webui/config/nginx.conf
# Start:  /opt/etc/init.d/S80nginx-webui start

load_module /opt/lib/nginx/modules/ngx_http_lua_module.so;

# Spike: root needed for status scripts (iptables, pidof).
# TODO(production): privilege separation via sudoers or unix socket helper.
user root;
worker_processes 1;

error_log /opt/var/log/nginx-webui-error.log error;
pid       /opt/var/run/nginx-webui.pid;

events {
    worker_connections 64;
}

http {
    include       /opt/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log disabled: all diagnostics via error_log + status.sh --json.
    # Eliminates ~1.5MB/day disk writes from API polling.
    access_log off;

    sendfile on;
    keepalive_timeout 30;

    lua_package_path "/opt/keenetic-entware-extras/webui/lua/?.lua;/opt/lib/lua/?.lua;/opt/lib/lua/?/init.lua;;";

    # ── Auto-detect stock CSS filename at startup ─────────────────────
    # Reads /usr/share/htdocs_/index.html to find styles-{HASH}.css.
    # Hash changes with firmware updates; detected once at nginx start.
    # Reload (`nginx -s reload`) re-detects after firmware upgrade.
    # Note: Entware nginx-mod-lua built with NGX_LUA_NO_BY_LUA_BLOCK,
    # so we use *_by_lua_file / *_by_lua string variants.
    init_by_lua_file /opt/keenetic-entware-extras/webui/lua/stock-css-init.lua;

    # Upstream: stock Keenetic WebUI
    upstream keenetic_ui {
        server 127.0.0.1:80;
        keepalive 4;
    }

    server {
        listen 10.0.0.1:8080;
        listen 127.0.0.1:8080;

        server_name _;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Increase proxy buffers: stock /rci/ responses up to 241KB,
        # avoids "buffered to temporary file" warnings and disk I/O.
        proxy_buffer_size    16k;
        proxy_buffers        8 32k;
        proxy_busy_buffers_size 64k;

        # ── Custom index.html with stock CSS auto-detection ───────────────
        # Exact match: serves index.html via Lua, replacing hardcoded
        # styles-*.css with the actual firmware hash detected at startup.
        # Requests to /custom/ trigger index → internal redirect here.
        location = /custom/index.html {
            default_type text/html;
            content_by_lua_file /opt/keenetic-entware-extras/webui/lua/serve-index.lua;
        }

        # ── Custom dashboard static files (JS, CSS, images) ──────────────
        location /custom/ {
            alias /opt/keenetic-entware-extras/webui/static/;
            index index.html;
            try_files $uri $uri/ /custom/index.html;

            # Prevent browser caching of our JS/CSS during spike iteration
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ── API: Lua router ───────────────────────────────────────────────
        location /api/ {
            default_type application/json;
            content_by_lua_file /opt/keenetic-entware-extras/webui/lua/api-router.lua;
        }

        # ── Stock Keenetic UI + inject.js ─────────────────────────────────
        location / {
            # Serve custom error page when stock Keenetic httpd is unavailable
            proxy_intercept_errors on;
            error_page 502 503 504 /custom/502.html;

            proxy_pass http://keenetic_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Auth passthrough (HTTP Digest)
            proxy_pass_header WWW-Authenticate;
            proxy_pass_header Authorization;
            proxy_pass_header Set-Cookie;
            proxy_set_header Cookie $http_cookie;

            # Disable compression so sub_filter can work
            proxy_set_header Accept-Encoding "";

            # ── sub_filter: inject.js + CDK DragDrop bundle patches ────────
            # Process JS responses too (default: text/html only)
            sub_filter_types application/javascript;
            sub_filter_once off;

            # 1. Inject our script before </body> (HTML only — pattern absent in JS)
            sub_filter '</body>' '<script src="/custom/inject.js"></script></body>';

            # 2. NdwDragPanel.set order — insert/reposition ENTWARE_EXTRAS.
            #    Single source of truth: window.__ewPos (synced by 5b after drag).
            #    If ENTWARE absent → insert at __ewPos.
            #    If ENTWARE present but wrong position → move to __ewPos.
            #    window.__ewLastOrder used by inject.js reconciler to map key→DOM row.
            sub_filter 'set order(e){this.elementsOrder=e}'
                       'set order(e){try{var flat=[].concat.apply([],e);if(flat.indexOf("ENTWARE_EXTRAS")===-1){var p=window.__ewPos||{c:0,i:999};var c=p.c,i=p.i;if(c>=e.length)c=0;if(i>e[c].length)i=e[c].length;if(e[c])e[c].splice(i,0,"ENTWARE_EXTRAS")}else{var p2=window.__ewPos;if(p2){for(var q=0;q<e.length;q++){var f=e[q].indexOf("ENTWARE_EXTRAS");if(f>=0){if(q!==p2.c||f!==p2.i){e[q].splice(f,1);var tc=p2.c<e.length?p2.c:0;var ti=p2.i<=e[tc].length?p2.i:e[tc].length;e[tc].splice(ti,0,"ENTWARE_EXTRAS")}break}}}}}catch(x){}window.__ewLastOrder=e;this.elementsOrder=e}';

            # 3. NdwDragPanel.getTemplate — return truthy placeholder for ENTWARE_EXTRAS.
            #    Truthy → ngClass !getTemplate(e) = false → row stays visible.
            #    Not a real TemplateRef — ngTemplateOutlet (patch #9) renders null for it.
            sub_filter 'getTemplate(e){return this.templateMap.get(e)}'
                       'getTemplate(e){return this.templateMap.get(e)||(e==="ENTWARE_EXTRAS"?{__ew:1}:void 0)}';

            # 9. ngTemplateOutlet — skip rendering for cards not in templateMap.
            #    Dashboard: ENTWARE_EXTRAS not in templateMap → null → empty CDK row.
            #    Dialog: ENTWARE_EXTRAS IS in templateMap (Bli template) → renders natively.
            #    All stock cards: in templateMap → render normally.
            sub_filter 'd("ngTemplateOutlet",i.getTemplate(e))'
                       'd("ngTemplateOutlet",i.templateMap.has(e)?i.getTemplate(e):null)';

            # 4. CdkDropList enter+sort predicates — catch getControl errors for injected cards.
            #    Cards Position dialog's predicates call getControl(cardId) which throws for
            #    ENTWARE_EXTRAS. enterPredicate controls cross-column moves, sortPredicate
            #    controls within-column sorting. Both wrapped in try-catch → return true on error.
            sub_filter 'this._dropListRef.enterPredicate=(n,r)=>this.enterPredicate(n.data,r.data),this._dropListRef.sortPredicate=(n,r,a)=>this.sortPredicate(n,r.data,a.data)'
                       'this._dropListRef.enterPredicate=(n,r)=>{try{return this.enterPredicate(n.data,r.data)}catch(_x){return!0}},this._dropListRef.sortPredicate=(n,r,a)=>{try{return this.sortPredicate(n,r.data,a.data)}catch(_x){return!0}}';

            # 5a. NdwDragPanel.drop PRE-MOVE — stamp source data before CDK move.
            #     Pattern lives inside if(expr, cond) comma expression, so replacement
            #     MUST be a pure expression (no var/let statements). Uses IIFE to detect
            #     ENTWARE drag and replace source slot; stores flag in window.__ewDrag.
            sub_filter 'this.isDragInProgress=!1'
                       '(window.__ewDrag=function(){try{var t=e.item&&e.item.element&&e.item.element.nativeElement;var r=!!(t&&(t.getAttribute("data-ew-key")==="entware-extras"||t.querySelector("#entware-dash-content")));if(r&&Array.isArray(e.previousContainer.data))e.previousContainer.data[e.previousIndex]="ENTWARE_EXTRAS";return r}catch(_){return!1}}(),this.isDragInProgress=!1)';

            # 5b. NdwDragPanel.drop POST-EMIT — dedupe ENTWARE_EXTRAS after move.
            #     CDK already moved the key; we only remove duplicate entries
            #     (keep first occurrence). Reads flag from window.__ewDrag.
            #     Syncs window.__ewLastOrder for the inject.js reconciler.
            sub_filter 'this.orderChanged.emit(this.order)'
                       'try{if(window.__ewDrag&&Array.isArray(this.order)){var f=!1;for(var _ci=0;_ci<this.order.length;_ci++){var _col=this.order[_ci];if(Array.isArray(_col))for(var _j=_col.length-1;_j>=0;_j--)_col[_j]==="ENTWARE_EXTRAS"&&(f?_col.splice(_j,1):f=!0)}}window.__ewLastOrder=this.order}catch(_x){}try{for(var _ci2=0;_ci2<this.order.length;_ci2++){var _idx2=this.order[_ci2].indexOf("ENTWARE_EXTRAS");if(_idx2>=0){window.__ewPos={c:_ci2,i:_idx2};try{localStorage.setItem("ew-card-pos",JSON.stringify(window.__ewPos))}catch(_){}break}}}catch(_){}this.orderChanged.emit(this.order)';

            # 6. DashboardCardId enum (Po) — register ENTWARE_EXTRAS as known card ID.
            #    Angular then treats it as first-class citizen: creates CDK row,
            #    includes in FormGroup, renders in Cards Position dialog natively.
            sub_filter 'TRAFFIC_MONITOR:"TRAFFIC_MONITOR",TELEPHONY:"TELEPHONY"}'
                       'TRAFFIC_MONITOR:"TRAFFIC_MONITOR",TELEPHONY:"TELEPHONY",ENTWARE_EXTRAS:"ENTWARE_EXTRAS"}';

            # 7. DASHBOARD_CARD_TITLE map (dXe) — display name for ENTWARE_EXTRAS.
            #    Value is passed to translateService.instant() which returns it as-is
            #    (no i18n key match → returns raw string "ENTWARE EXTRAS").
            sub_filter '[Po.TELEPHONY]:"dashboard.card_nvox.title"};'
                       '[Po.TELEPHONY]:"dashboard.card_nvox.title",ENTWARE_EXTRAS:"ENTWARE EXTRAS"};';

            # 8. Cards Position dialog CARD_ID_LIST — bypass isCardAvailable check
            #    for ENTWARE_EXTRAS. Without this, sectionManager.isAvailable() rejects
            #    ENTWARE_EXTRAS (not a registered hardware section) and dialog omits it.
            sub_filter 'Object.keys(Po).filter(a=>this.viewService.isCardAvailable(a))'
                       'Object.keys(Po).filter(a=>a==="ENTWARE_EXTRAS"||this.viewService.isCardAvailable(a))';
        }
    }
}

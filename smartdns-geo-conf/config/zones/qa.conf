# Zone: QA (🇶🇦 Qatar)
# Part of smartdns-geo-conf. Included via dns-zones-active.conf.

# --- Upstream DNS servers for qa group ---

# Cloudflare DoT (global anycast, geo-optimized responses)
server-tls 1.1.1.1:853 -group qa -exclude-default-group \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com

server-tls 1.0.0.1:853 -group qa -exclude-default-group \
    -host-name cloudflare-dns.com \
    -tls-host-verify cloudflare-dns.com

# Google DoT (global anycast)
server-tls 8.8.8.8:853 -group qa -exclude-default-group \
    -host-name dns.google \
    -tls-host-verify dns.google

server-tls 8.8.4.4:853 -group qa -exclude-default-group \
    -host-name dns.google \
    -tls-host-verify dns.google

# UDP fallback
server 1.1.1.1 -group qa -exclude-default-group
server 8.8.8.8 -group qa -exclude-default-group

# --- Nameserver routing rules (QA) ---
nameserver /.qa/qa
nameserver /.xn--wgbl6a/qa

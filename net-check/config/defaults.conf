#!/opt/bin/sh
# Default configuration for net-check.
# Network connectivity diagnostics and degradation control.
# shellcheck disable=SC2034
# NOTE: _CONFIG_DIR must be set by the sourcing script before sourcing this file

# --- WAN Interfaces ---
# Auto-detect if empty (all WAN interfaces via wan-paths.sh enumeration)
CHECK_INTERFACES=""

# --- Network ---
LAN_BRIDGE="br0"

# --- Connectivity ---
# IP for traceroute, ping (loss/jitter), MTU discovery probes.
# Must be a reliable, globally-reachable host. Default: Google Public DNS.
CONNECTIVITY_TARGET="8.8.8.8"
# HTTP endpoint for connectivity check (must return 204 or 200).
CONNECTIVITY_URL="https://www.gstatic.com/generate_204"

# --- Timeouts (seconds) ---
HTTP_TIMEOUT=10
CONNECT_TIMEOUT=5
DNS_TIMEOUT=2
# Per-probe timeout for ICMP/traceroute (ping -W, traceroute -w).
PROBE_TIMEOUT=2
SPEED_TIMEOUT=30
GEOIP_TIMEOUT=3

# --- HTTP / curl ---
# Max redirects curl will follow (-L --max-redirs).
# 5 covers sites like ozon.ru (4+ hops); real redirect loops are 20+.
MAX_REDIRS=10
# Sent with all curl requests to avoid Cloudflare/GitHub blocks.
# Override in config.conf if needed.
CURL_UA="Mozilla/5.0 (compatible; net-check/1.0)"

# --- DNS ---
# Domains parsed from check-targets.conf (non-geo entries).
# Zone/intl type auto-detected via GeoIP of resolved IP.
# ISP DNS blocking checked for every domain.
DNS_LEAK_CHECK_DOMAIN="whoami.akamai.net"
DNS_CACHE_TTL=60
KEENETIC_DNS_CONF="/tmp/ndnproxymain.conf"
SMARTDNS_PORT=6053
DNS_PROBE_PORTS="53 6053 5353"

# --- GeoIP Services ---
# Public IP detection (tried in order).
# Format: url|response_type (plain|json_full)
GEO_SERVICES="https://ifconfig.me/ip|plain https://api.ipify.org|plain https://ipinfo.io/json|json_full"
# IP-to-geo resolution (tried in order, full JSON preferred for enrichment).
# Format: url|response_type — {ip} placeholder replaced at runtime.
# Types: ipapi_json (ip-api.com), ipinfo_json (ipinfo.io), plain (CC only).
GEOIP_SERVICES="http://ip-api.com/json/{ip}|ipapi_json https://ipinfo.io/{ip}/json|ipinfo_json https://ipinfo.io/{ip}/country|plain"
# TTL in seconds for per-interface geo cache files.
# 1800s (30min): interface external IP can change (DHCP, VPN reconnect).
GEO_CACHE_TTL=1800
# TTL for unified per-IP geo cache (CC + city + ASN + org).
# 86400s (24h): geo data for a given IP rarely changes.
# Used by geolocate_ip() — shared across geo, dns, cdn, tls commands.
IPGEO_CACHE_TTL=86400

# --- Speed test ---
# Download size in bytes for throughput measurement.
# 1MB default — reasonable balance between accuracy and traffic consumption.
SPEED_TEST_BYTES=1000000
# Cloudflare speed test endpoints.
SPEED_DL_URL="https://speed.cloudflare.com/__down?bytes=${SPEED_TEST_BYTES}"
SPEED_UL_URL="https://speed.cloudflare.com/__up"

# --- Traceroute / Ping ---
TRACEROUTE_MAX_HOPS=15
PING_COUNT=5

# --- CDN Steering ---
# Resolver for EDNS Client Subnet (ECS) queries (must support ECS).
CDN_ECS_RESOLVER="8.8.8.8"

# --- IPv6 leak check ---
IPV6_CHECK_URL="https://api6.ipify.org"

# --- Batch processing ---
# "auto" = adaptive based on CPU load/cores; numeric = fixed batch size.
PARALLEL_BATCH_SIZE=auto
CDN_BATCH_SIZE=auto

# --- Process priority ---
# nice adjustment for all net-check operations (0=disabled, 1-19=lower priority).
# Reduces CPU contention on router during parallel checks.
NICE_ADJUST=10

# --- Thresholds ---
DEGRADED_TTFB_RATIO=3
MAX_REDIRECT_WARN=3

# --- Verbosity & Output ---
# 0=quiet (one-line summary), 1=normal (default), 2=verbose (timing waterfall)
VERBOSITY=1
STATUS_DETAIL="summary"

# --- Custom targets ---
CUSTOM_TARGETS=""

# --- Data & Cache ---
# Persistent storage for cache files and results.
# Created by postinst; lazy mkdir in script as safety net.
DATA_DIR="/opt/tmp/net-check"
CACHE_FILE="${DATA_DIR}/compare-last.json"
CACHE_TTL=60

# --- External config files ---
# File with one marker string per line; used for body content anomaly detection.
ANOMALY_MARKERS_FILE="${_CONFIG_DIR}/anomaly-markers.conf"
# Known MITM proxy CA issuers; one pattern per line (case-insensitive substring match).
MITM_ISSUERS_FILE="${_CONFIG_DIR}/mitm-issuers.conf"
# DNS provider identification patterns.
DNS_PROVIDERS_FILE="${_CONFIG_DIR}/dns-providers.conf"
# Well-known public DNS resolver IPs.
WELLKNOWN_IPS_FILE="${_CONFIG_DIR}/wellknown-ips.conf"
